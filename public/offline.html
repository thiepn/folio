<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>Folio — Offline</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090b10;color:#ebe8e2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 420px at 50% 0,rgba(118,87,255,.12),transparent 72%),#090b10}
    main{width:min(620px,100%);border-top:1px solid rgba(118,87,255,.55);border-bottom:1px solid #252a32;padding:44px 0}.k{font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#8c8f96}h1{margin:10px 0 12px;font:500 clamp(34px,7vw,56px)/1.02 Georgia,serif}p{max-width:52ch;color:#a8abb2;line-height:1.65}button{margin-top:16px;min-height:40px;border:1px solid #3a3f49;background:#121722;color:#ebe8e2;padding:0 15px;cursor:pointer}
  </style>
</head>
<body><main><div class="k">Offline fallback</div><h1>The planner shell is not available yet.</h1><p>This device has no network connection and the production app shell was not fully cached. Reconnect once, open Folio, and allow the offline installation to finish. Existing IndexedDB data has not been deleted.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
