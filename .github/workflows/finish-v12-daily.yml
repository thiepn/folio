name: Finish Folio v1.2 Daily Workflow

on:
  push:
    branches: [v1.2-daily-workflow]
    paths:
      - '.github/workflows/finish-v12-daily.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Integrate Daily Workflow
        run: node scripts/integrate-v12-daily.mjs

      - name: Remove staging helpers
        run: rm scripts/integrate-v12-daily.mjs .github/workflows/finish-v12-daily.yml

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify v1.2 release
        run: npm run release:verify

      - name: Refresh release manifest
        run: npm run manifest:release

      - name: Commit verified v1.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Folio v1.2 daily workflow"
          git push origin HEAD:v1.2-daily-workflow
