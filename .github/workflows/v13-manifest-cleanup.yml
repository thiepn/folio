name: Regenerate Folio v1.3 Release Manifest

on:
  push:
    branches: [v1.3-manifest-cleanup]
    paths:
      - '.github/workflows/v13-manifest-cleanup.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Regenerate manifest from clean source tree
        run: |
          rm .github/workflows/v13-manifest-cleanup.yml
          node scripts/generate-release-manifest.mjs
      - name: Commit manifest correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: correct Folio v1.3 release manifest"
          git push origin HEAD:v1.3-manifest-cleanup
