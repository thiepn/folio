name: Verify Folio v1.2 release cleanup

on:
  push:
    branches: [v1.2-release-cleanup]
    paths:
      - '.github/workflows/cleanup-v12-release.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release
        run: npm run release:verify

      - name: Verify compiler outputs stay absent
        run: |
          test ! -e tsconfig.app.tsbuildinfo
          test ! -e tsconfig.node.tsbuildinfo
          test ! -e vite.config.js
          test ! -e vite.config.d.ts

      - name: Remove temporary workflow and refresh manifest
        run: |
          rm .github/workflows/cleanup-v12-release.yml
          npm run manifest:release

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean Folio v1.2 release artifacts"
          git push origin HEAD:v1.2-release-cleanup
