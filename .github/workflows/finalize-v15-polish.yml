name: Finalize Folio v1.5 Review Polish

on:
  push:
    branches: [v1.5-reviews-history]
    paths:
      - '.github/workflows/finalize-v15-polish.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify polished v1.5 release
        run: npm run release:verify

      - name: Remove temporary workflow and refresh manifest
        run: |
          rm .github/workflows/finalize-v15-polish.yml
          npm run manifest:release

      - name: Commit certified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: certify Folio v1.5 review polish"
          git push origin HEAD:v1.5-reviews-history
