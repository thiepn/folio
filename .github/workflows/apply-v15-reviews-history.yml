name: Apply Folio v1.5 Reviews History

on:
  push:
    branches: [v1.5-reviews-history]
    paths:
      - '.github/workflows/apply-v15-reviews-history.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply v1.5 integration
        run: |
          node scripts/fix-v15-integration.mjs
          node scripts/apply-v15-integration.mjs

      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify v1.5 release
        run: npm run release:verify

      - name: Remove staging helpers and refresh manifest
        run: |
          rm scripts/apply-v15-integration.mjs scripts/fix-v15-integration.mjs .github/workflows/apply-v15-reviews-history.yml
          npm run manifest:release

      - name: Commit verified v1.5 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Folio v1.5 reviews and history"
          git push origin HEAD:v1.5-reviews-history
