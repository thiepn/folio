name: Apply Folio v1.3 Task Project Workflow

on:
  push:
    branches: [v1.3-task-project-workflow]
    paths:
      - '.github/workflows/apply-v13-task-project.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply v1.3 core integration
        run: node scripts/apply-v13-core.mjs

      - name: Make inherited Daily Workflow contract forward compatible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate-daily-workflow.mjs')
          text = p.read_text()
          old1 = "check('v1.2 package version', pkg.version === '1.2.0')"
          new1 = "check('v1.2+ package version', Number(pkg.version.split('.')[1] ?? 0) >= 2)"
          old2 = "check('v12 data model retained', /DATABASE_SCHEMA_VERSION\\s*=\\s*12\\b/.test(database))"
          new2 = "check('daily workflow compatible schema', Number(database.match(/DATABASE_SCHEMA_VERSION\\s*=\\s*(\\d+)/)?.[1] ?? 0) >= 12)"
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('Daily Workflow validator anchors changed unexpectedly')
          p.write_text(text.replace(old1, new1).replace(old2, new2))
          PY

      - name: Update v13 project constructors and fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Demo projects must satisfy the canonical v13 ProjectEntity shape.
          p = Path('src/db/seed.ts')
          text = p.read_text()
          text, count = re.subn(
              r"(description: '[^']*', )color:",
              r"\1notes: '', status: 'active', milestones: [], activity: [], color:",
              text,
          )
          if count != 4:
              raise SystemExit(f'seed.ts: expected 4 project fixture updates, found {count}')
          p.write_text(text)

          # Logic-case fixtures remain intentionally minimal, but canonical.
          for path in ['src/features/planner/advancedPlanningCases.ts', 'src/features/review/reviewLogicCases.ts']:
              p = Path(path)
              text = p.read_text()
              old = "description: '', type: 'academic'"
              new = "description: '', notes: '', type: 'academic', status: 'active', milestones: [], activity: []"
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one academic project fixture')
              p.write_text(text.replace(old, new, 1))

          # Factory-created projects receive complete v13 execution defaults.
          p = Path('src/services/entityFactory.ts')
          text = p.read_text()
          old = """    description: parsed.description,
    color: parsed.color,
    icon: parsed.icon,
    type: parsed.type,
    archived: false,
    favorite: parsed.favorite,"""
          new = """    description: parsed.description,
    notes: parsed.notes,
    color: parsed.color,
    icon: parsed.icon,
    type: parsed.type,
    status: parsed.status,
    deadline: parsed.deadline,
    milestones: [],
    activity: [{ id: crypto.randomUUID(), kind: 'project', label: 'Project created', at: now }],
    completedAt: parsed.status === 'completed' ? now : undefined,
    archived: false,
    favorite: parsed.favorite,"""
          if text.count(old) != 1:
              raise SystemExit('entityFactory.ts: project factory anchor changed unexpectedly')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify v1.3 release
        run: npm run release:verify

      - name: Remove staging helpers and refresh manifest
        run: |
          rm scripts/apply-v13-core.mjs .github/workflows/apply-v13-task-project.yml
          npm run manifest:release

      - name: Commit verified v1.3 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Folio v1.3 task and project workflow"
          git push origin HEAD:v1.3-task-project-workflow
