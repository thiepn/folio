name: Apply Folio v1.1.1 build fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v111-build.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          replace(
              'src/services/runtimeIssueService.ts',
              '  return () => listeners.delete(listener)',
              '  return () => { listeners.delete(listener) }',
          )

          replace(
              'src/services/entityFactory.ts',
              'id = crypto.randomUUID()',
              'id: string = crypto.randomUUID()',
              expected=5,
          )

          Path('tsconfig.node.json').write_text('''{
            "compilerOptions": {
              "composite": true,
              "skipLibCheck": true,
              "target": "ES2022",
              "lib": ["ES2022"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "allowImportingTsExtensions": false
            },
            "include": ["vite.config.ts"]
          }
          ''')

          replace(
              'src/features/patch/patchLogic.ts',
              "  return op.op === 'create' ? op.value.ref : op.id",
              "  return op.op === 'create' ? (op.value.ref ?? '(new)') : op.id",
          )
          replace(
              'src/features/patch/patchLogic.ts',
              '''      const ref = op.value.ref
              if (createdRefs.has(ref)) issues.push(issue('error', 'duplicate_create_ref', `Create ref “${ref}” is used more than once.`, index))
              createdRefs.add(ref)
              if (op.entity === 'project') createdProjectRefs.add(ref)
              if (op.entity === 'task') { createdTaskRefs.add(ref); createdTaskValues.set(ref, op.value) }
              return''',
              '''      const ref = op.value.ref
              if (ref) {
                if (createdRefs.has(ref)) issues.push(issue('error', 'duplicate_create_ref', `Create ref “${ref}” is used more than once.`, index))
                createdRefs.add(ref)
                if (op.entity === 'project') createdProjectRefs.add(ref)
                if (op.entity === 'task') { createdTaskRefs.add(ref); createdTaskValues.set(ref, op.value) }
              }
              return''',
          )
          replace(
              'src/features/patch/patchLogic.ts',
              'target: op.value.ref,',
              'target: operationTarget(op),',
          )

          replace(
              'src/db/seed.ts',
              "await db.transaction('rw', db.tasks, db.projects, db.habits, db.habitEntries, db.timeBlocks, db.dailyPlans, db.dailyPlanItems, db.settings, async () => {",
              "await db.transaction('rw', [db.tasks, db.projects, db.habits, db.habitEntries, db.timeBlocks, db.dailyPlans, db.dailyPlanItems, db.settings], async () => {",
          )

          replace(
              'src/services/backupService.ts',
              '''await db.transaction('rw',
              db.tasks, db.projects, db.habits, db.habitEntries, db.timeBlocks, db.dailyPlans, db.dailyPlanItems,
              db.focusSessions, db.recurringSeries, db.settings, db.importBatches, db.patchBatches, db.calendarImportBatches,
              async () => {''',
              '''await db.transaction('rw', [
              db.tasks, db.projects, db.habits, db.habitEntries, db.timeBlocks, db.dailyPlans, db.dailyPlanItems,
              db.focusSessions, db.recurringSeries, db.settings, db.importBatches, db.patchBatches, db.calendarImportBatches,
              ], async () => {''',
          )

          replace(
              'src/services/databaseService.ts',
              '''await db.transaction('rw',
              db.tasks, db.projects, db.habits, db.habitEntries, db.timeBlocks, db.dailyPlans, db.dailyPlanItems,
              db.focusSessions, db.recurringSeries, db.settings, db.importBatches, db.patchBatches, db.calendarImportBatches,
              async () => {''',
              '''await db.transaction('rw', [
              db.tasks, db.projects, db.habits, db.habitEntries, db.timeBlocks, db.dailyPlans, db.dailyPlanItems,
              db.focusSessions, db.recurringSeries, db.settings, db.importBatches, db.patchBatches, db.calendarImportBatches,
              ], async () => {''',
          )

          replace(
              'src/services/importService.ts',
              "await db.transaction('rw', db.timeBlocks, db.dailyPlanItems, db.tasks, db.recurringSeries, db.habitEntries, db.habits, db.projects, db.dailyPlans, db.importBatches, async () => {",
              "await db.transaction('rw', [db.timeBlocks, db.dailyPlanItems, db.tasks, db.recurringSeries, db.habitEntries, db.habits, db.projects, db.dailyPlans, db.importBatches], async () => {",
          )
          replace(
              'src/services/importService.ts',
              "await db.transaction('rw', db.projects, db.tasks, db.habits, db.timeBlocks, db.recurringSeries, db.dailyPlans, db.importBatches, async () => {",
              "await db.transaction('rw', [db.projects, db.tasks, db.habits, db.timeBlocks, db.recurringSeries, db.dailyPlans, db.importBatches], async () => {",
          )

          replace(
              'src/services/patchService.ts',
              "await db.transaction('rw', db.projects, db.tasks, db.habits, db.timeBlocks, db.recurringSeries, db.dailyPlans, db.dailyPlanItems, db.patchBatches, async () => {",
              "await db.transaction('rw', [db.projects, db.tasks, db.habits, db.timeBlocks, db.recurringSeries, db.dailyPlans, db.dailyPlanItems, db.patchBatches], async () => {",
              expected=2,
          )
          PY

          rm .github/workflows/fix-v111-build.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve v1.1.1 production build blockers"
          git push origin HEAD:main
