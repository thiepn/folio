name: Live Folio smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Playwright controller
        shell: pwsh
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Verify live Folio
        shell: pwsh
        env:
          FOLIO_URL: https://thiepn.dev/folio/
        run: |
          @'
          const { chromium } = require('playwright-core')

          ;(async () => {
            const browser = await chromium.launch({
              executablePath: 'C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe',
              headless: true,
              args: ['--no-first-run', '--disable-background-networking'],
            })
            const page = await browser.newPage()
            const errors = []
            page.on('pageerror', error => errors.push(String(error)))
            page.on('console', message => console.log('[browser]', message.type(), message.text()))

            const response = await page.goto(process.env.FOLIO_URL, { waitUntil: 'domcontentloaded', timeout: 20000 })
            console.log('HTTP_STATUS=' + (response ? response.status() : 'none'))

            await page.waitForFunction(() => {
              const text = document.body.innerText
              return Boolean(document.getElementById('main-content'))
                && !text.includes('Opening Folio')
                && !text.includes('Opening local workspace')
            }, undefined, { timeout: 20000 })

            const result = await page.evaluate(() => ({
              title: document.title,
              text: document.body.innerText.slice(0, 1200),
              hasMain: Boolean(document.getElementById('main-content')),
              controlled: Boolean(navigator.serviceWorker?.controller),
            }))
            console.log('LIVE_FOLIO_STATE=' + JSON.stringify(result))
            console.log('PAGE_ERRORS=' + JSON.stringify(errors))

            if (!response || !response.ok()) throw new Error('Live Folio returned a non-success HTTP response.')
            if (!result.hasMain) throw new Error('Live Folio did not render main-content.')
            if (result.text.includes('Opening Folio')) throw new Error('Live Folio remained stuck in startup.')
            if (result.text.includes('Folio could not open its workspace')) throw new Error('Live Folio entered database recovery.')
            if (result.text.includes('This browser is missing required')) throw new Error('Live Folio entered compatibility failure.')
            if (errors.length) throw new Error('Live Folio emitted page errors: ' + errors.join(' | '))

            await browser.close()
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          '@ | Set-Content -Encoding utf8 .live-folio-smoke.cjs
          node .live-folio-smoke.cjs
