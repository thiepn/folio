name: Windows browser boot smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install and build
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          npm run build

      - name: Start preview
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1" -PassThru
          $p.Id | Out-File preview.pid
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4173/ -TimeoutSec 2
              if ($r.StatusCode -eq 200) { exit 0 }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Get-Content preview.log
          exit 1

      - name: Real browser boot smoke
        shell: pwsh
        run: |
          @'
          const { chromium } = require('playwright-core');

          (async () => {
            const executablePath = String.raw`C:\Program Files\Google\Chrome\Application\chrome.exe`;
            const browser = await chromium.launch({
              executablePath,
              headless: true,
              args: ['--no-first-run', '--disable-background-networking'],
            });
            const page = await browser.newPage();
            const consoleRows = [];
            const pageErrors = [];
            page.on('console', (msg) => {
              const row = msg.type() + ': ' + msg.text();
              consoleRows.push(row);
              console.log('[browser console]', row);
            });
            page.on('pageerror', (error) => {
              pageErrors.push(String(error));
              console.log('[page error]', String(error));
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 15000 });
            await page.waitForTimeout(10000);

            const state = await page.evaluate(() => ({
              bootStage: document.documentElement.dataset.folioBootStage ?? null,
              bodyText: document.body.innerText,
              main: Boolean(document.getElementById('main-content')),
              rootHtml: document.getElementById('root')?.innerHTML ?? '',
            }));
            console.log('FOLIO_STATE=' + JSON.stringify(state));
            console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));

            if (!state.main) throw new Error('Folio did not render main-content.');
            if (state.bodyText.includes('Opening Folio')) throw new Error('Folio remained stuck in startup at ' + state.bootStage);
            if (state.bodyText.includes('Folio could not open its workspace')) throw new Error('Folio entered database recovery at ' + state.bootStage);
            if (state.bodyText.includes('This browser is missing required')) throw new Error('Folio entered compatibility failure.');
            if (pageErrors.length) throw new Error('Folio emitted page errors: ' + pageErrors.join(' | '));

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          '@ | Set-Content -Encoding utf8 smoke.cjs
          node smoke.cjs
