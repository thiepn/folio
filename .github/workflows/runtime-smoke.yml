name: Runtime browser smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.62.1

      - name: Build
        run: npm run build

      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/folio-preview.log 2>&1 &
          echo $! > /tmp/folio-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/folio-preview.log
          exit 1

      - name: Resolve browser
        id: browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then BROWSER=$(command -v google-chrome)
          elif command -v google-chrome-stable >/dev/null; then BROWSER=$(command -v google-chrome-stable)
          elif command -v chromium >/dev/null; then BROWSER=$(command -v chromium)
          else echo 'No Chromium-family browser found'; exit 1; fi
          echo "path=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Smoke local production build
        env:
          BROWSER_PATH: ${{ steps.browser.outputs.path }}
        run: |
          cat > /tmp/folio-smoke.cjs <<'NODE'
          const { chromium } = require('playwright-core')

          ;(async () => {
            const browser = await chromium.launch({
              executablePath: process.env.BROWSER_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--no-first-run', '--disable-background-networking'],
            })
            const page = await browser.newPage()
            const pageErrors = []
            page.on('console', (message) => console.log('[browser console]', message.type(), message.text()))
            page.on('pageerror', (error) => {
              pageErrors.push(String(error))
              console.error('[page error]', error)
            })

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 15000 })
            try {
              await page.waitForFunction(() => !document.body.innerText.includes('Opening Folio'), undefined, { timeout: 15000 })
            } catch {
              // Report the complete state below.
            }

            const state = await page.evaluate(() => ({
              text: document.body.innerText,
              hasMain: Boolean(document.getElementById('main-content')),
              html: document.getElementById('root')?.innerHTML ?? '',
            }))
            console.log('FOLIO_STATE=' + JSON.stringify(state))
            console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors))

            if (!state.hasMain) throw new Error('Folio did not render main-content.')
            if (state.text.includes('Opening Folio')) throw new Error('Folio remained stuck in startup.')
            if (state.text.includes('Folio could not open its workspace')) throw new Error('Folio entered database recovery.')
            if (state.text.includes('This browser is missing required')) throw new Error('Folio entered compatibility failure.')
            if (pageErrors.length) throw new Error('Folio emitted page errors: ' + pageErrors.join(' | '))

            await browser.close()
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
          node /tmp/folio-smoke.cjs
